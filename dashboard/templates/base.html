<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard{% endblock %} — Site Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff', 100:'#e0e7ff', 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca', 900:'#312e81' }
          }
        }
      }
    }
  </script>
  <style>
    [hx-indicator] .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }

    @keyframes pulse-dot { 0%,100%{ opacity:1 } 50%{ opacity:.4 } }
    .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="h-full text-gray-100">
  <div class="flex h-full">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
      <div class="p-5 border-b border-gray-800">
        <h1 class="text-lg font-bold text-white tracking-tight">Site Factory</h1>
        <p class="text-xs text-gray-500 mt-0.5">Marketing Site Generator</p>
      </div>

      <nav class="flex-1 p-3 space-y-1">
        <a href="/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition
          {% if active == 'overview' %}bg-brand-600/20 text-brand-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Overview
        </a>
        <a href="/upload" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition
          {% if active == 'upload' %}bg-brand-600/20 text-brand-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          Upload Data
        </a>
        <a href="/monitor" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition
          {% if active == 'monitor' %}bg-brand-600/20 text-brand-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Monitor
          {% if stats and stats.is_running %}<span class="ml-auto w-2 h-2 bg-green-400 rounded-full pulse-dot"></span>{% endif %}
        </a>
        <a href="/logs" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition
          {% if active == 'logs' %}bg-brand-600/20 text-brand-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Logs
        </a>
        <a href="/sites" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition
          {% if active == 'sites' %}bg-brand-600/20 text-brand-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Deployed Sites
        </a>

        <div class="pt-4 mt-4 border-t border-gray-800">
          <a href="/settings" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition
            {% if active == 'settings' %}bg-brand-600/20 text-brand-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Settings
          </a>
        </div>
      </nav>

      <!-- Status indicator -->
      <div class="p-4 border-t border-gray-800">
        <div class="flex items-center gap-2 text-xs text-gray-500">
          {% if stats and stats.is_running %}
            <span class="w-2 h-2 bg-green-400 rounded-full pulse-dot"></span>
            <span class="text-green-400">Batch running</span>
          {% else %}
            <span class="w-2 h-2 bg-gray-600 rounded-full"></span>
            <span>Idle</span>
          {% endif %}
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      <div class="p-8">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>
</body>
</html>
