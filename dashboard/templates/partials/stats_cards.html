<div class="grid grid-cols-2 md:grid-cols-5 gap-4">
  <!-- Total -->
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
    <p class="text-xs text-gray-500 uppercase tracking-wider">Total</p>
    <p class="text-2xl font-bold text-white mt-1">{{ stats.total or 0 }}</p>
  </div>

  <!-- Queued -->
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
    <p class="text-xs text-gray-500 uppercase tracking-wider">Queued</p>
    <p class="text-2xl font-bold text-gray-400 mt-1">{{ stats.queued or 0 }}</p>
  </div>

  <!-- Building -->
  <div class="bg-gray-900 border border-yellow-900/30 rounded-xl p-4">
    <p class="text-xs text-yellow-500 uppercase tracking-wider">Building</p>
    <p class="text-2xl font-bold text-yellow-400 mt-1">{{ stats.building or 0 }}</p>
  </div>

  <!-- Complete -->
  <div class="bg-gray-900 border border-green-900/30 rounded-xl p-4">
    <p class="text-xs text-green-500 uppercase tracking-wider">Complete</p>
    <p class="text-2xl font-bold text-green-400 mt-1">{{ stats.complete or 0 }}</p>
  </div>

  <!-- Failed -->
  <div class="bg-gray-900 border border-red-900/30 rounded-xl p-4">
    <p class="text-xs text-red-500 uppercase tracking-wider">Failed</p>
    <p class="text-2xl font-bold text-red-400 mt-1">{{ stats.failed or 0 }}</p>
  </div>
</div>
