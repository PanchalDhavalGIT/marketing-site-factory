{% extends "base.html" %}
{% set active = "logs" %}

{% block title %}Log: {{ slug }}{% endblock %}

{% block content %}
<div class="max-w-6xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="/logs" class="text-gray-500 hover:text-gray-300 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h2 class="text-2xl font-bold text-white">{{ slug }}</h2>
    <span class="text-xs bg-gray-800 text-gray-400 px-2 py-1 rounded-full font-mono">{{ slug }}.log</span>
  </div>

  <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 bg-gray-800/50 border-b border-gray-800">
      <span class="text-xs text-gray-500">Auto-refreshing every 3 seconds</span>
      <span class="text-xs text-gray-500">Last {{ lines|length }} entries</span>
    </div>
    <div hx-get="/api/logs/{{ slug }}/content" hx-trigger="every 3s" hx-swap="innerHTML"
         class="p-4 max-h-[600px] overflow-y-auto font-mono text-xs" id="log-content">
      {% include "partials/log_content.html" %}
    </div>
  </div>
</div>
{% endblock %}
